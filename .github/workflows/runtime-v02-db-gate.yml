name: Runtime v0.2 DB Gate

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - ".github/workflows/runtime-v02-db-gate.yml"
  workflow_dispatch:

jobs:
  runtime-v02-db-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Bootstrap Supabase-compatible auth and API roles
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin;

          create schema auth;
          create table auth.users (
            id uuid primary key,
            email text,
            created_at timestamptz not null default now()
          );

          create or replace function auth.uid()
          returns uuid
          language sql
          stable
          as $$
            select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid
          $$;

          create or replace function auth.jwt()
          returns jsonb
          language sql
          stable
          as 'select coalesce(nullif(current_setting(''request.jwt.claims'', true), '''')::jsonb, ''{}''::jsonb)';

          grant usage on schema auth to anon, authenticated, service_role;
          grant execute on function auth.uid() to anon, authenticated, service_role;
          grant execute on function auth.jwt() to anon, authenticated, service_role;
          SQL

      - name: Replay runtime foundation and v0.2 migrations
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/001_perception_memory.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/002_perception_runtime.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/003_perception_verified_vertical_slice.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/004_perception_runtime_api_hardening.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/005_perception_worker_artifact_index.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/021_runtime_v02_ledgers.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/022_runtime_v02_operational_wiring.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/023_runtime_v02_continuation_route.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/029_dynamic_reality_route.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/030_local_execution_truth_bridge.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/031_runtime_v05_reliable_continuation.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/032_scenario_forge_warm_start.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/033_scenario_forge_idle_bridge.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/034_anticipatory_retrieval_intent_shadow.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260930154726_warm_start_security_invoker.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260930181140_operator_controls_require_permanent_user.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260930184506_scenario_utility_learning_v10.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260930192306_external_anticipatory_search_preferences_v11.sql

      - name: Run Runtime v0.2 security and truth assertions
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/runtime_v02_db_gate.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/runtime_v06_scenario_forge_gate.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/runtime_v07_scenario_forge_idle_gate.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/runtime_v08_intent_shadow_gate.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/runtime_security_hardening_gate.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/runtime_v10_scenario_utility_gate.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/runtime_v11_external_presearch_gate.sql
