name: Forecast coherence patch

on:
  push:
    branches:
      - fix/project-world-forecast-coherence

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[forecast-coherence-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/project-world-forecast-coherence
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply coherence patch
        run: python scripts/patch-forecast-coherence.py
      - name: Remove one-shot helpers
        run: rm scripts/patch-forecast-coherence.py .github/workflows/forecast-coherence-patch.yml
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Run sovereignty tests
        run: npm run test:sovereignty
      - name: Build
        run: npm run build
      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: keep forecasts inside their Project World [forecast-coherence-done]"
          git push origin HEAD:fix/project-world-forecast-coherence
