name: Consumer PR hygiene

on:
  push:
    branches:
      - feat/consumer-homepage-productization

permissions:
  contents: write

jobs:
  clean-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[hygiene-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/consumer-homepage-productization
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove generated files from version control
        run: |
          git rm -r node_modules dist
          cat > .gitignore <<'EOF'
          node_modules/
          dist/
          .vite/
          *.tsbuildinfo
          EOF
          rm .github/workflows/consumer-pr-hygiene.yml
          git add .gitignore
          git add -u .github/workflows/consumer-pr-hygiene.yml
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Run sovereignty tests
        run: npm run test:sovereignty
      - name: Build
        run: npm run build
      - name: Verify generated output is ignored
        run: |
          test -z "$(git status --porcelain --untracked-files=all | grep -E '^(\?\?| M| A) (node_modules/|dist/)' || true)"
      - name: Commit clean PR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: keep generated artifacts out of source [hygiene-done]"
          git push origin HEAD:feat/consumer-homepage-productization
