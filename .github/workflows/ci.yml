name: Perception CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - name: Hagerstown Well Help zero-send practice gate
        run: npm run practice:hwh
      - run: npm run test:sovereignty
      - name: DataCenter bridge auth gate
        run: |
          grep -q '^\[functions.datacenter-forums-bridge\]$' supabase/config.toml
          grep -A 1 '^\[functions.datacenter-forums-bridge\]$' supabase/config.toml | grep -q '^verify_jwt = false$'
          grep -q 'x-perception-timestamp' supabase/functions/datacenter-forums-bridge/index.ts
          grep -q 'x-perception-signature' supabase/functions/datacenter-forums-bridge/index.ts
          grep -q 'verifyDataCenterSignature' supabase/functions/datacenter-forums-bridge/index.ts
          grep -q 'perception_bridge_receipts' supabase/functions/datacenter-forums-bridge/index.ts
      - name: Hagerstown provider-response auth gate
        run: |
          grep -q '^\[functions.microsite-provider-response\]$' supabase/config.toml
          grep -A 1 '^\[functions.microsite-provider-response\]$' supabase/config.toml | grep -q '^verify_jwt = false$'
          grep -q "verifyOfferToken" supabase/functions/microsite-provider-response/index.ts
          grep -q "MICROSITE_OFFER_TOKEN_SECRET" supabase/functions/microsite-provider-response/index.ts
          grep -q "perception_accept_microsite_offer" supabase/functions/microsite-provider-response/index.ts
          ! grep -E 'console\.(log|error|warn)\([^)]*(token|MICROSITE_OFFER_TOKEN_SECRET)' supabase/functions/microsite-provider-response/index.ts
      - run: bash -n scripts/perception-sovereign-backup.sh scripts/perception-sovereign-restore-check.sh
      - run: npm run build
      - run: npm --prefix microsites/hagerstown test
      - run: npm --prefix microsites/hagerstown run build
