name: Apply perceive-objective binding fix

on:
  push:
    branches:
      - fix/perceive-objective-ledger-binding

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/perceive-objective-ledger-binding
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Restore missing capability ledger bindings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('supabase/functions/perceive-objective/index.ts')
          text = path.read_text()

          route_anchor = """      for (const decision of capabilityRouting.filter((candidate) => candidate.executionMode === 'external')) {
        const routeNode = routePlan.nodes.find((node) => node.key === decision.nodeKey)
        let actionContract: ReturnType<typeof buildGitHubActionContract> | null = null
"""
          route_replacement = """      for (const decision of capabilityRouting.filter((candidate) => candidate.executionMode === 'external')) {
        const routeNode = routePlan.nodes.find((node) => node.key === decision.nodeKey)
        const continuationIndex = continuationPlanNodes.findIndex((candidate) => candidate.key === decision.nodeKey)
        const expectedSortOrder = continuationIndex >= 0 ? continuationIndex + 1 : null
        const routeNodeId = expectedSortOrder === null
          ? null
          : (persistedRouteNodes.data ?? []).find((candidate) => candidate.sort_order === expectedSortOrder)?.id ?? null
        let actionContract: ReturnType<typeof buildGitHubActionContract> | null = null
"""

          status_anchor = """          actionContracts.push(actionContract)
        }

        const { error: intentError } = await admin.from('perception_execution_ledger').insert({
"""
          status_replacement = """          actionContracts.push(actionContract)
        }

        const routingStatus = actionContract?.status ?? decision.status

        const { error: intentError } = await admin.from('perception_execution_ledger').insert({
"""

          if text.count(route_anchor) != 1:
              raise SystemExit(f'route anchor count was {text.count(route_anchor)}, expected 1')
          if text.count(status_anchor) != 1:
              raise SystemExit(f'status anchor count was {text.count(status_anchor)}, expected 1')

          text = text.replace(route_anchor, route_replacement, 1)
          text = text.replace(status_anchor, status_replacement, 1)
          path.write_text(text)
          PY

      - name: Verify regression and full test suite
        run: |
          npm install
          npm test
          npm run test:sovereignty
          npm run build

      - name: Commit verified fix and remove temporary workflow
        run: |
          rm .github/workflows/fix-perceive-objective-ledger-binding.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/perceive-objective/index.ts .github/workflows/fix-perceive-objective-ledger-binding.yml
          git commit -m "fix: restore capability ledger bindings"
          git push origin HEAD:fix/perceive-objective-ledger-binding
