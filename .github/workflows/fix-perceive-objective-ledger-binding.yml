name: Apply perceive-objective binding fix

on:
  push:
    branches:
      - fix/perceive-objective-ledger-binding

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/perceive-objective-ledger-binding
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Restore missing capability ledger bindings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('supabase/functions/perceive-objective/index.ts')
          lines = path.read_text().splitlines()
          route_anchor = "        const routeNode = routePlan.nodes.find((node) => node.key === decision.nodeKey)"
          ledger_anchor = "        const { error: intentError } = await admin.from('perception_execution_ledger').insert({"
          if lines.count(route_anchor) != 1:
              raise SystemExit(f'route anchor count was {lines.count(route_anchor)}, expected 1')
          if lines.count(ledger_anchor) != 1:
              raise SystemExit(f'ledger anchor count was {lines.count(ledger_anchor)}, expected 1')
          route_index = lines.index(route_anchor)
          route_bindings = [
              "        const continuationIndex = continuationPlanNodes.findIndex((candidate) => candidate.key === decision.nodeKey)",
              "        const expectedSortOrder = continuationIndex >= 0 ? continuationIndex + 1 : null",
              "        const routeNodeId = expectedSortOrder === null",
              "          ? null",
              "          : (persistedRouteNodes.data ?? []).find((candidate) => candidate.sort_order === expectedSortOrder)?.id ?? null",
          ]
          lines[route_index + 1:route_index + 1] = route_bindings
          ledger_index = lines.index(ledger_anchor)
          lines[ledger_index:ledger_index] = [
              "        const routingStatus = actionContract?.status ?? decision.status",
              "",
          ]
          path.write_text('\n'.join(lines) + '\n')
          PY

      - name: Verify regression and full test suite
        run: |
          npm install
          npm test
          npm run test:sovereignty
          npm run build

      - name: Commit verified fix and remove temporary workflow
        run: |
          rm .github/workflows/fix-perceive-objective-ledger-binding.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/perceive-objective/index.ts .github/workflows/fix-perceive-objective-ledger-binding.yml
          git commit -m "fix: restore capability ledger bindings"
          git push origin HEAD:fix/perceive-objective-ledger-binding
